name: Build and Release

# Code signing (SignPath OSS — free for open source):
# 1. Apply: https://signpath.io/solutions/open-source-community
# 2. After approval, create project slug `clipshot`, policy `release-signing`,
#    trusted build system GitHub.com, repo niimbu/clipshot.
#    Paste .signpath/artifact-configurations/default.xml as the artifact config.
# 3. Install the SignPath GitHub App on this repo.
# 4. GitHub → Settings → Secrets and variables → Actions:
#    - Secret: SIGNPATH_API_TOKEN
#    - Variables: SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG (=clipshot),
#      SIGNPATH_SIGNING_POLICY_SLUG (=release-signing)
# Until those are set, release builds stay unsigned (SmartScreen may warn).

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Prepare branding assets
        shell: pwsh
        run: |
          if (-not (Get-Command magick.exe -ErrorAction SilentlyContinue)) {
            choco install imagemagick --no-progress --yes
          }
          ./assets/branding/build-branding.ps1

      - name: Build
        run: dotnet build ClipShot.slnx --configuration Release

      - name: Publish self-contained Windows app
        run: dotnet publish src/ClipShot.App/ClipShot.App.csproj --configuration Release --runtime win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:DebugType=None -p:DebugSymbols=false --output publish/win-x64

      - name: Check SignPath configuration
        id: signpath-check
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          ORG_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          PROJECT: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          POLICY: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
        run: |
          if [ -n "$TOKEN" ] && [ -n "$ORG_ID" ] && [ -n "$PROJECT" ] && [ -n "$POLICY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "::notice::SignPath signing enabled — ClipShot.exe will be Authenticode-signed"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::SignPath not configured — release will be UNSIGNED. See docs/RELEASING.md (SignPath OSS)."
          fi

      - name: Upload unsigned exe for SignPath
        id: upload-unsigned
        if: startsWith(github.ref, 'refs/tags/v') && steps.signpath-check.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ClipShot-unsigned
          path: publish/win-x64/ClipShot.exe
          if-no-files-found: error

      - name: Sign with SignPath
        if: startsWith(github.ref, 'refs/tags/v') && steps.signpath-check.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: publish/win-x64-signed

      - name: Use SignPath-signed executable
        if: startsWith(github.ref, 'refs/tags/v') && steps.signpath-check.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem -Path "publish/win-x64-signed" -Filter "ClipShot.exe" -Recurse | Select-Object -First 1
          if (-not $signed) { throw "SignPath did not return ClipShot.exe." }
          Copy-Item -LiteralPath $signed.FullName -Destination "publish/win-x64/ClipShot.exe" -Force
          Write-Host "Replaced publish/win-x64/ClipShot.exe with the SignPath-signed build."

      # Optional fallback: local PFX in repo secrets (not needed when SignPath is configured).
      - name: Sign Windows executable (PFX fallback)
        if: steps.signpath-check.outputs.enabled != 'true'
        shell: pwsh
        env:
          SIGNING_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:SIGNING_CERTIFICATE_PASSWORD)) {
            Write-Host "No SignPath and no PFX secrets; continuing with an unsigned build."
            exit 0
          }

          $certificatePath = Join-Path $env:RUNNER_TEMP "clipshot-signing.pfx"
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:SIGNING_CERTIFICATE_BASE64))
          try {
            $sdkRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits/10/bin"
            $signtool = Get-ChildItem $sdkRoot -Filter signtool.exe -Recurse |
              Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if (-not $signtool) { throw "Windows SDK signtool.exe was not found on the runner." }

            $exePath = "publish/win-x64/ClipShot.exe"
            & $signtool.FullName sign /fd SHA256 /td SHA256 /tr "http://timestamp.digicert.com" /f $certificatePath /p $env:SIGNING_CERTIFICATE_PASSWORD $exePath
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signing failed with exit code $LASTEXITCODE." }

            & $signtool.FullName verify /pa /v $exePath
            if ($LASTEXITCODE -ne 0) { throw "Authenticode signature verification failed." }
          }
          finally {
            Remove-Item $certificatePath -Force -ErrorAction SilentlyContinue
          }

      - name: Prepare release assets and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Copy-Item publish/win-x64/ClipShot.exe release-assets/ClipShot.exe

          # Package as ClipShot.zip so the browser download name stays short.
          $staging = Join-Path $env:RUNNER_TEMP "clipshot-zip-staging"
          if (Test-Path $staging) { Remove-Item $staging -Recurse -Force }
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item publish/win-x64/ClipShot.exe (Join-Path $staging "ClipShot.exe")
          Compress-Archive -Path (Join-Path $staging "*") -DestinationPath release-assets/ClipShot.zip -Force

          $assets = Get-ChildItem release-assets -File | Sort-Object Name
          $checksums = $assets | ForEach-Object {
            "$( (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() )  $($_.Name)"
          }
          $checksums | Set-Content release-assets/SHA256SUMS.txt -Encoding ascii

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ClipShot
          path: release-assets/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: ClipShot
          path: release-files

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-files/ClipShot.exe
            release-files/ClipShot.zip
            release-files/SHA256SUMS.txt
